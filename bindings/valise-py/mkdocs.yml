# mkdocstrings imports the `valise` package at build time, which imports the
# compiled `valise._native` cdylib. You MUST run `maturin develop` before
# `mkdocs build` (and especially `mkdocs build --strict`), or every `:::`
# directive in the reference page will fail to resolve. See docs/contributing.md.
site_name: valise
site_description: Python bindings for the Valise single-file archive format
repo_url: https://github.com/white07S/valise
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/brightness-7, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/brightness-4, name: Switch to light mode }

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [python]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_if_no_docstring: false
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            merge_init_into_class: true
            filters: ["!^_"]
            inherited_members: false

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Concepts:
      - Data model: concepts/model.md
      - Schemas & Spaces: concepts/spaces.md
      - Records: concepts/records.md
      - Search & Fusion: concepts/search.md
      - Recency: concepts/recency.md
      - Partitions: concepts/partitions.md
  - API Reference: reference.md
  - Performance: performance.md
  - Contributing: contributing.md
