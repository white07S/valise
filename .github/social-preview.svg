<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="valise — Retrieval in one file.">
  <defs>
    <!-- Warm leather tone: `valise` is a small travel case, and the accent
         is deliberately not the purple/blue every AI tool uses. -->
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#C9884A" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#C9884A" stop-opacity="0.55"/>
      <stop offset="1"   stop-color="#C9884A" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="#0D0D0F"/>

  <!-- Suitcase mark: one closed outline, low opacity, well clear of the
       headline so it never competes with it at unfurl size. -->
  <g stroke="#C9884A" stroke-opacity="0.16" fill="none" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <rect x="558" y="146" width="164" height="118" rx="12"/>
    <path d="M612 146 v-18 a10 10 0 0 1 10 -10 h36 a10 10 0 0 1 10 10 v18"/>
    <line x1="558" y1="191" x2="722" y2="191"/>
    <circle cx="640" cy="227" r="7"/>
  </g>

  <text x="640" y="328" text-anchor="middle"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="34" font-weight="500" letter-spacing="13" fill="#C9884A">valise</text>

  <text x="640" y="428" text-anchor="middle"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="86" font-weight="700" letter-spacing="-2" fill="#F5F1EA">Retrieval in one file.</text>

  <line x1="440" y1="471" x2="840" y2="471" stroke="url(#rule)" stroke-width="2"/>

  <text x="640" y="525" text-anchor="middle"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="26" font-weight="400" letter-spacing="0.6" fill="#9A958C">BM25 + vector search &#183; one portable file &#183; no index to build</text>
</svg>
