name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # A RUSTFLAGS env var REPLACES `target.*.rustflags` from .cargo/config.toml
  # rather than merging with it, so the x86-64-v3 baseline has to be repeated
  # here or the Linux jobs would silently stop exercising the static AVX2
  # dispatch path. Keep this in sync with .cargo/config.toml.
  #
  # `-D warnings` is deliberately NOT set here: it would also apply to the
  # clippy step and promote every style lint to an error. It is set per-step
  # on the build and test steps, which is where rustc warnings matter.
  RUSTFLAGS: -C target-cpu=x86-64-v3

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The workhorse: everything that does not need Apple silicon runs here.
  # Linux runners are ~10x cheaper in Actions minutes than macOS ones, and
  # x86_64 exercises the AVX2 kernels that the aarch64 job cannot.
  check:
    name: fmt / clippy / test (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      # Warnings are errors. The deliberate exceptions live in
      # `[lints.clippy]` in Cargo.toml with a justification each, so a new
      # warning here means either fix it or argue for it in the manifest.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build (default features)
        run: cargo build --all-targets
        env:
          RUSTFLAGS: -C target-cpu=x86-64-v3 -D warnings

      - name: Build (library only, no default features)
        run: cargo build --no-default-features
        env:
          RUSTFLAGS: -C target-cpu=x86-64-v3 -D warnings

      - name: Test
        run: cargo test --all-targets

      # Builds the surface docs.rs will publish. Broken intra-doc links fail
      # the build: they render as dead links on docs.rs, which is the main
      # discovery surface for a Rust crate.
      - name: Doc build
        run: cargo doc --no-deps --no-default-features
        env:
          RUSTDOCFLAGS: -D warnings

  # Apple silicon: NEON kernels and the macOS file-locking paths have no
  # coverage on Linux. Kept to a single build+test on pushes to main so the
  # 10x minute multiplier does not apply to every pull request.
  macos:
    name: test (aarch64-apple-darwin)
    if: github.event_name == 'push'
    runs-on: macos-14
    timeout-minutes: 30
    # Override the workflow-level RUSTFLAGS: `-C target-cpu=x86-64-v3` is
    # meaningless on aarch64. NEON and dotprod are baseline on Apple silicon,
    # so nothing needs to replace it.
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --all-targets

  # The manifest's rust-version is a promise; verify it compiles.
  msrv:
    name: msrv (1.87)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.87
      - uses: Swatinem/rust-cache@v2
      - name: Check against declared MSRV
        run: cargo check --all-targets

  # Catches an unpublishable manifest (bad metadata, missing license file,
  # oversized tarball) before a release tag rather than after.
  package:
    name: cargo package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify the crate packages cleanly
        run: cargo package --no-verify --allow-dirty
