[package]
name = "valise-vmcrash-worker"
version = "0.1.0"
edition = "2024"
description = "In-guest commit/verify worker for the QEMU power-cut campaign"
publish = false

# Standalone crate: do not join any parent workspace.
[workspace]

[dependencies]
valise = { path = "../../.." }
libc = "0.2"
sha2 = "0.10"
hex = "0.4"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
# Keep panics visible on the console instead of unwinding into a hung PID 1.
panic = "abort"
